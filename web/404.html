<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Варвара</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/booking.css">
</head>
<body>

<header id="header" class="header"></header>

<main class="wrap wrap--narrow auth">
  <div class="auth__card">
    <p class="eyebrow">Ошибка 404</p>
    <h1 class="auth__title">Такой страницы нет</h1>
    <p class="auth__sub">
      Возможно, ссылка устарела или в адресе опечатка. Всё, что нужно для записи, — на главной.
    </p>

    <div id="msg"></div>

    <div class="row">
      <a class="btn" href="/booking">Записаться</a>
      <a class="btn btn--secondary" href="/">На главную</a>
      <a class="btn btn--ghost" href="/account">Мои записи</a>
    </div>

    <p class="auth__foot" id="studio"></p>
  </div>
</main>

<script type="module" src="/js/404.js"></script>

</html>
