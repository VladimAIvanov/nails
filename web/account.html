<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои записи — Ноготочки</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/booking.css">
</head>
<body>

<header id="header" class="header"></header>

<main class="wrap wrap--narrow section">
  <p class="eyebrow">Личный кабинет</p>
  <h1 id="hello">Мои записи</h1>
  <p class="lead section__sub" id="hello-sub">Ближайшие визиты и история.</p>

  <div id="msg"></div>

  <div class="tabs">
    <button class="tab tab--on" data-tab="upcoming" type="button">
      Активные <span class="tab__count" id="count-upcoming">·</span>
    </button>
    <button class="tab" data-tab="past" type="button">
      История <span class="tab__count" id="count-past">·</span>
    </button>
    <button class="tab" data-tab="waitlist" type="button">
      Лист ожидания <span class="tab__count" id="count-waitlist">·</span>
    </button>
    <a class="btn btn--sm tabs__action" href="/booking">Записаться</a>
  </div>

  <div class="stack" id="list">
    <div class="skeleton skeleton-card"></div>
  </div>

  <p class="auth__foot">
    <a href="/profile">Профиль и напоминания</a> · <a href="/bonuses">Абонементы и баллы</a> ·
    <a href="/password-change">Сменить пароль</a> · <a href="/sessions">Устройства и входы</a>
  </p>
</main>

<script type="module" src="/js/account.js"></script>
</body>
</html>
