<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Варвара · услуги и мастера</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Услуги и мастера</h1>
  <p class="hint">Открытая часть API: вход не требуется. Цены приходят в копейках, здесь переводятся в рубли.</p>

  <div id="msg"></div>

  <section>
    <h2>Студия</h2>
    <div id="studio">Загрузка…</div>
  </section>

  <section>
    <h2>Услуги</h2>
    <div class="row">
      <div>
        <label for="category">Категория</label>
        <select id="category"></select>
      </div>
      <button id="reload" type="button">Обновить</button>
    </div>
    <div id="services"></div>
  </section>

  <section>
    <h2>Мастера</h2>
    <div class="row">
      <div>
        <label for="service-filter">Кто делает услугу</label>
        <select id="service-filter"></select>
      </div>
    </div>
    <div id="masters"></div>
  </section>
</main>

<script type="module">
import { api, guard, renderNav, el, table, fillSelect, money, studio } from './app.js';

renderNav();

/* Загрузка страницы идёт через ту же обёртку, что и нажатия: отказ сервера
   при открытии должен попадать на экран, а не только в консоль. */
async function loadStudio() {
  const settings = await studio();
  document.getElementById('studio').replaceChildren(
    el('p', {}, `${settings.title}, ${settings.city}, ${settings.address_line}`),
    el('p', { className: 'hint' },
      `Часовой пояс ${settings.timezone} · онлайн-запись ${settings.online_booking_enabled ? 'включена' : 'выключена'} · `
      + `бесплатная отмена за ${settings.free_cancellation_lead_min} мин`)
  );
}

let allServices = [];

async function loadServices() {
  const category = document.getElementById('category').value;
  const data = await api('GET', `/api/services${category ? `?category=${encodeURIComponent(category)}` : ''}`);

  if (allServices.length === 0) {
    allServices = data.services;
    fillSelect(document.getElementById('category'), data.categories,
      { value: (c) => c.slug, label: (c) => c.title, empty: 'все категории' });
    fillSelect(document.getElementById('service-filter'), data.services,
      { value: (s) => s.id, label: (s) => s.title, empty: 'любую' });
  }

  const rows = data.services.map((s) => el('tr', {},
    el('td', {}, s.id),
    el('td', {}, s.title, s.badge ? el('div', { className: 'hint' }, s.badge) : null),
    el('td', {}, s.category.title),
    el('td', {}, `${s.duration_is_from ? 'от ' : ''}${s.duration_min} мин`),
    el('td', {}, `${s.price_is_from ? 'от ' : ''}${money(s.price_kopecks)}`),
    el('td', { className: 'actions' },
      el('a', { href: `slots.html?service_id=${s.id}`, textContent: 'свободное время' }))
  ));

  document.getElementById('services').replaceChildren(
    rows.length
      ? table(['id', 'Услуга', 'Категория', 'Длительность', 'Цена', ''], rows)
      : el('p', { className: 'muted' }, 'В этой категории услуг нет')
  );
}

async function loadMasters() {
  const serviceId = document.getElementById('service-filter').value;
  const data = await api('GET', `/api/masters${serviceId ? `?service_id=${serviceId}` : ''}`);

  const rows = data.masters.map((m) => el('tr', {},
    el('td', {}, m.id),
    el('td', {}, m.name),
    el('td', {}, m.specialization.join(', ') || '—'),
    el('td', {}, m.rating ? `${m.rating} (${m.reviews_count})` : 'нет отзывов'),
    el('td', {}, m.accepts_online_booking ? 'да' : 'нет'),
    el('td', { className: 'actions' },
      el('a', {
        href: `slots.html?master_id=${m.id}${serviceId ? `&service_id=${serviceId}` : ''}`,
        textContent: 'свободное время'
      }))
  ));

  document.getElementById('masters').replaceChildren(
    rows.length
      ? table(['id', 'Мастер', 'Специализация', 'Рейтинг', 'Онлайн-запись', ''], rows)
      : el('p', { className: 'muted' }, 'Мастеров с такой услугой нет')
  );
}

document.getElementById('category').addEventListener('change', guard(loadServices));
document.getElementById('service-filter').addEventListener('change', guard(loadMasters));
document.getElementById('reload').addEventListener('click', guard(async () => {
  await loadServices();
  await loadMasters();
}));

await guard(loadStudio)();
await guard(loadServices)();
await guard(loadMasters)();
</script>
</body>
</html>
