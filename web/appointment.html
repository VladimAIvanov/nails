<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись — Варвара</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/booking.css">
</head>
<body>

<header id="header" class="header"></header>

<main class="wrap wrap--narrow section">
  <p class="eyebrow"><a href="/account">← Мои записи</a></p>
  <h1 id="title">Запись</h1>

  <div id="msg"></div>

  <div class="card stack" id="card">
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
  </div>

  <div class="row visit__actions" id="actions"></div>
</main>

<!-- Окно подтверждения: отмена и перенос необратимы, поэтому спрашиваем -->
<div class="modal" id="modal" hidden>
  <div class="modal__box card">
    <h3 id="modal-title"></h3>
    <div id="modal-body" class="stack"></div>
    <div class="row modal__actions">
      <button class="btn" id="modal-ok" type="button"></button>
      <button class="btn btn--secondary" id="modal-cancel" type="button">Не сейчас</button>
    </div>
  </div>
</div>

<script type="module" src="/js/appointment.js"></script>
</body>
</html>
