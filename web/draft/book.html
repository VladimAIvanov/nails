<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Варвара · создать запись</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Создание записи</h1>
  <p class="hint">
    Запись создаёт клиентка. Мастер и администратор оформляют визит на странице «Студия» —
    сохраняет их всех одна и та же функция на сервере.
  </p>

  <div id="msg"></div>

  <section>
    <div class="row">
      <div>
        <label for="master">Мастер</label>
        <select id="master"></select>
      </div>
      <div>
        <label for="starts">Начало, UTC (ISO-8601)</label>
        <input id="starts" placeholder="2026-08-25T09:00:00Z">
      </div>
    </div>
    <p id="local-preview" class="hint"></p>

    <label>Услуги</label>
    <div id="services" class="hint">Загрузка…</div>

    <label for="comment">Комментарий мастеру</label>
    <textarea id="comment" rows="2" maxlength="1000"></textarea>

    <div>
      <button id="hold" type="button">Удержать окно</button>
      <button id="create" type="button">Записаться</button>
      <a href="slots.html">выбрать время из списка окон</a>
    </div>
    <p id="hold-state" class="hint"></p>
  </section>

  <section>
    <h2>Что получилось</h2>
    <div id="result" class="muted">Записи пока нет.</div>
  </section>
</main>

<script type="module">
import {
  api, guard, renderNav, el, table, money, studio, whenLocal, query, currentUser, showOk, showError
} from './app.js';

renderNav();

const params = query();

const masterSelect = document.getElementById('master');
const startsInput = document.getElementById('starts');
const preview = document.getElementById('local-preview');

startsInput.value = params.get('starts_at') ?? '';

let settings = null;
let hold = null;

/* Первая загрузка идёт через ту же обёртку, что и нажатия: отказ сервера
   при открытии страницы должен быть виден на экране. */
async function init() {
  settings = await studio();

  const masters = (await api('GET', '/api/masters')).masters;
  for (const m of masters) {
    masterSelect.append(el('option', { value: String(m.id), textContent: `${m.name} (id ${m.id})` }));
  }
  if (params.get('master_id')) masterSelect.value = params.get('master_id');
  showPreview(); // теперь пояс студии известен — показываем время по-человечески
}

/* Пояс студии приходит с сервера, поэтому до конца загрузки его ещё нет:
   показываем время как есть, а не падаем на пустых настройках. */
function showPreview() {
  const value = startsInput.value.trim();
  if (!value || Number.isNaN(Date.parse(value))) {
    preview.textContent = 'Время указывается в UTC и заканчивается на Z. Проще выбрать окно на странице «Свободное время».';
    return;
  }
  preview.textContent = settings
    ? `По времени студии: ${whenLocal(value, settings.timezone)} (${settings.timezone})`
    : `Начало ${value} (UTC)`;
}

async function loadServices() {
  const box = document.getElementById('services');
  box.replaceChildren('Загрузка…');

  const master = await api('GET', `/api/masters/${masterSelect.value}`);
  if (master.services.length === 0) {
    box.replaceChildren(el('span', { className: 'muted' }, 'У мастера нет услуг'));
    return;
  }

  const wanted = params.getAll('service_id');
  box.replaceChildren(...master.services.map((s) => el('label', {},
    el('input', {
      type: 'checkbox', className: 'service', value: String(s.id),
      checked: wanted.includes(String(s.id))
    }),
    ` ${s.title} — ${s.duration_min} мин, ${money(s.price_kopecks)}`
  )));
}

const chosen = () => [...document.querySelectorAll('.service:checked')].map((i) => Number(i.value));

/* Удержание — то же, что делает настоящее приложение, пока клиентка
   заполняет форму: занимает окно на несколько минут, чтобы его не увели
   на последнем шаге. Токен передаётся при создании записи. */
async function holdSlot() {
  const data = await api('POST', '/api/holds', {
    master_id: Number(masterSelect.value),
    service_ids: chosen(),
    starts_at: startsInput.value.trim()
  });
  hold = data.hold_token;
  document.getElementById('hold-state').textContent =
    `Окно удержано до ${whenLocal(data.expires_at, settings.timezone)} `
    + `(${Math.round(data.expires_in_sec / 60)} мин). Токен: ${hold.slice(0, 8)}…`;
  showOk('Окно удержано — теперь его не займут, пока вы заполняете форму.');
}

async function create() {
  const services = chosen();
  if (services.length === 0) {
    showError({ status: 400, message: 'Отметьте хотя бы одну услугу', details: null });
    return;
  }

  const data = await api('POST', '/api/appointments', {
    master_id: Number(masterSelect.value),
    service_ids: services,
    starts_at: startsInput.value.trim(),
    comment: document.getElementById('comment').value.trim() || undefined,
    hold_token: hold ?? undefined
  });

  hold = null;
  document.getElementById('hold-state').textContent = '';
  showOk(`Записались. Создано записей: ${data.appointments.length}.`);

  const rows = data.appointments.map((a) => el('tr', {},
    el('td', {}, a.id),
    el('td', {}, a.number ?? '—'),
    el('td', {}, a.service.title),
    el('td', {}, a.master.name),
    el('td', {}, `${a.local.date} ${a.local.time}`),
    el('td', {}, money(a.price_kopecks)),
    el('td', {}, a.status_title)
  ));

  document.getElementById('result').replaceChildren(
    table(['id', 'Номер', 'Услуга', 'Мастер', 'Когда', 'Цена', 'Статус'], rows),
    el('p', { className: 'hint' }, 'Записи видны в разделе «Кабинет» — там же перенос и отмена.')
  );
}

masterSelect.addEventListener('change', guard(loadServices));
startsInput.addEventListener('input', showPreview);

document.getElementById('hold').addEventListener('click', guard(holdSlot));

/* Ошибка «время занято» приходит с подсказкой ближайших окон: нажатие
   на окно подставляет его в поле, чтобы можно было сразу повторить. */
document.getElementById('create').addEventListener('click', async (event) => {
  event.preventDefault();
  try {
    await create();
  } catch (err) {
    showError(err, 'msg', {
      onSlot: (slot) => {
        startsInput.value = slot.starts_at;
        showPreview();
        window.scrollTo({ top: 0 });
      }
    });
    if (err.status === 403 && currentUser()) {
      document.getElementById('msg').append(
        el('p', { className: 'hint' },
          'Записывать других может администратор — страница «Студия». Клиентка записывает только себя.')
      );
    }
  }
});

showPreview();
await guard(init)();
if (masterSelect.options.length > 0) await guard(loadServices)();
</script>
</body>
</html>
