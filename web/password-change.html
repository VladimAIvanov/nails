<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смена пароля — Ноготочки</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>

<header id="header" class="header"></header>

<main class="wrap auth">
  <div class="auth__card">
    <h1 class="auth__title">Смена пароля</h1>
    <p class="auth__sub">Все прежние входы закроются — на других устройствах придётся войти заново.</p>

    <div id="msg"></div>

    <form id="form" novalidate>
      <label class="field">
        <span class="field__label">Текущий пароль</span>
        <input class="field__input" name="current_password" type="password" required
               autocomplete="current-password">
      </label>

      <label class="field">
        <span class="field__label">Новый пароль</span>
        <input class="field__input" name="new_password" type="password" required minlength="8"
               autocomplete="new-password">
        <span class="field__hint">Не короче восьми символов</span>
      </label>

      <label class="field">
        <span class="field__label">Новый пароль ещё раз</span>
        <input class="field__input" name="repeat" type="password" required minlength="8"
               autocomplete="new-password">
      </label>

      <button class="btn btn--wide btn--lg" type="submit">Сменить пароль</button>
    </form>

    <p class="auth__foot">
      <a href="/account">Вернуться в кабинет</a> · <a href="/sessions">Устройства и входы</a>
    </p>
  </div>
</main>

<script type="module" src="/js/password-change.js"></script>
</body>
</html>
