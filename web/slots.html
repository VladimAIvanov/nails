<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Варвара · свободное время</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Свободное время мастера</h1>
  <p class="hint">
    Готовых слотов в базе нет — сервер считает их на лету: рабочие часы, минус блокировки,
    записи и живые удержания, шагом сетки, с учётом длительности выбранных услуг.
  </p>

  <div id="msg"></div>

  <section>
    <div class="row">
      <div>
        <label for="master">Мастер</label>
        <select id="master"></select>
      </div>
      <div>
        <label for="date">Дата</label>
        <input id="date" type="date">
      </div>
      <button id="show" type="button">Показать окна</button>
    </div>

    <label>Услуги (длительности складываются)</label>
    <div id="services" class="hint">выберите мастера</div>
  </section>

  <section>
    <h2>Результат</h2>
    <div id="result" class="muted">Задайте мастера, дату и услуги.</div>
  </section>
</main>

<script type="module">
import { api, guard, renderNav, el, studio, today, whenLocal, query } from './app.js';

renderNav();

const settings = await studio();
const params = query();

const masterSelect = document.getElementById('master');
const dateInput = document.getElementById('date');
dateInput.value = params.get('date') ?? today(settings.timezone);

/* Причины, по которым окон нет, приходят кодом — переводим их в текст,
   иначе пустой список выглядит как поломка. */
const REASONS = {
  online_booking_disabled: 'Онлайн-запись в студии сейчас выключена',
  master_not_bookable: 'Мастер не принимает онлайн-запись',
  beyond_horizon: 'Эта дата дальше горизонта записи',
  day_off: 'В этот день мастер не работает'
};

const masters = (await api('GET', '/api/masters')).masters;
for (const m of masters) {
  masterSelect.append(el('option', { value: String(m.id), textContent: `${m.name} (id ${m.id})` }));
}
if (params.get('master_id')) masterSelect.value = params.get('master_id');

async function loadServices() {
  const masterId = masterSelect.value;
  const box = document.getElementById('services');
  box.replaceChildren('Загрузка…');

  const master = await api('GET', `/api/masters/${masterId}`);
  if (master.services.length === 0) {
    box.replaceChildren(el('span', { className: 'muted' }, 'У мастера нет услуг'));
    return;
  }

  const wanted = params.getAll('service_id');
  box.replaceChildren(...master.services.map((s) => el('label', {},
    el('input', {
      type: 'checkbox', value: String(s.id), className: 'service',
      checked: wanted.includes(String(s.id))
    }),
    ` ${s.title} — ${s.duration_min} мин`
  )));

  // если услугу не передали ссылкой, отмечаем первую: так удобнее проверять
  if (!box.querySelector('.service:checked')) box.querySelector('.service').checked = true;
}

function chosenServices() {
  return [...document.querySelectorAll('.service:checked')].map((i) => i.value);
}

async function loadSlots() {
  const masterId = masterSelect.value;
  const date = dateInput.value;
  const services = chosenServices();
  const result = document.getElementById('result');

  if (services.length === 0) {
    result.replaceChildren(el('p', { className: 'muted' }, 'Отметьте хотя бы одну услугу'));
    return;
  }

  const qs = new URLSearchParams({ date });
  for (const id of services) qs.append('service_id', id);
  const data = await api('GET', `/api/masters/${masterId}/slots?${qs}`);

  const head = el('p', {},
    `Визит займёт ${data.duration_min} мин`,
    data.buffer_min ? ` плюс ${data.buffer_min} мин перерыва` : '',
    ` · сетка по ${data.step_min} мин · пояс ${data.timezone}`);

  if (!data.slots.length) {
    result.replaceChildren(head,
      el('p', { className: 'msg error' }, REASONS[data.reason] ?? 'Свободных окон в этот день нет'));
    return;
  }

  const buttons = data.slots.map((slot) => {
    const link = el('a', {
      className: 'slot',
      href: `book.html?master_id=${masterId}&starts_at=${encodeURIComponent(slot.starts_at)}`
        + services.map((id) => `&service_id=${id}`).join(''),
      title: slot.starts_at
    }, el('button', { type: 'button' }, slot.local_time));
    return link;
  });

  result.replaceChildren(head,
    el('p', {}, `Свободно окон: ${data.free_count}`),
    el('div', {}, ...buttons),
    el('p', { className: 'hint' },
      `Кнопка ведёт на страницу записи с подставленным временем. Первое окно в UTC: ${data.slots[0].starts_at} `
      + `(по студии ${whenLocal(data.slots[0].starts_at, data.timezone)}).`)
  );
}

masterSelect.addEventListener('change', guard(loadServices));
document.getElementById('show').addEventListener('click', guard(loadSlots));

await guard(loadServices)();
if (params.get('master_id') || params.get('service_id')) await guard(loadSlots)();
</script>
</body>
</html>
