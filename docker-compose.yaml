# Описание запуска сервиса на сервере.
#
# Всё, без чего сервис не поднимется, перечислено здесь и едет вместе с кодом.
# В панели развёртывания остаётся только то, что относится к конкретной
# площадке: ссылка на репозиторий, домен и секреты. Настройка, заданная мышью
# и нигде не записанная, теряется при первом же переезде на другой сервер.

services:
  app:
    # Собирается по нашему Dockerfile из корня проекта.
    build:
      context: .
      dockerfile: Dockerfile

    # Контейнер поднимается сам после перезагрузки сервера и после падения,
    # но не после того, как его остановили руками.
    restart: unless-stopped

    # ГЛАВНАЯ СТРОКА ВСЕГО ФАЙЛА.
    #
    # Том — каталог на диске сервера, подключённый снаружи. При каждом
    # развёртывании контейнер уничтожается и создаётся заново, и всё, что
    # лежало внутри него, уезжает вместе со старым. База — файл, и без этой
    # строки она была бы таким же содержимым контейнера.
    #
    # Пропажа при этом выглядит как успех: в логе ни одной ошибки, сервис
    # открывается, миграции создают чистую базу с нуля. Отличить одно от
    # другого можно только вторым развёртыванием.
    volumes:
      - varvara-data:/app/storage

    environment:
      # Куда класть базу — внутрь тома, а не рядом с кодом.
      - SQLITE_PATH=/app/storage/varvara.db

      # Порт приложения. Задан здесь, чтобы не указывать его в панели.
      - PORT=3000

      # Рабочий режим: сервер требует, чтобы TLS кто-то завершал, и
      # отказывается стартовать по открытому HTTP.
      - NODE_ENV=production

      # Кто завершает TLS. Прокси Coolify приходит с адреса docker-сети,
      # а установщик Coolify раздаёт их из 10.0.0.0/8 — это его пул,
      # он прописан на сервере в /etc/docker/daemon.json.
      #
      # Не секрет, поэтому лежит здесь. Точный адрес указывать нельзя:
      # он меняется при пересоздании сети, и тогда сервис либо перестанет
      # стартовать, либо молча потеряет Secure на куке сеанса.
      - TRUST_PROXY=10.0.0.0/8

      # Вход через Яндекс задаётся ТОЛЬКО в панели развёртывания, тремя
      # переменными: YANDEX_CLIENT_ID, YANDEX_CLIENT_SECRET,
      # YANDEX_REDIRECT_URI. Здесь их намеренно нет, и это не забывчивость.
      #
      # Строка вида `- YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}` здесь стояла
      # и оказалась хуже отсутствия: если панель не подставила значение при
      # разборе файла, в контейнер уходит явная пустая строка — и она
      # перебивает то, что панель добавляет от себя. Проверено на боевом:
      # имена внутри контейнера были, значения пустые.
      #
      # Пустое объявление сильнее отсутствующего. Поэтому переменную, которая
      # приходит снаружи, в файле описания лучше не упоминать вовсе.
      #
      # Адрес возврата Яндекс сверяет посимвольно — протокол, домен, путь,
      # косую черту в конце — и должен совпадать со строкой из кабинета
      # приложения буква в букву. Без любой из трёх строк вход считается
      # ненастроенным: сервер отвечает отказом, кнопка не рисуется.

      # Первый администратор на чистой базе. Значения задаются в панели
      # развёртывания и в репозиторий не попадают: пароль — секрет.
      # Пустые значения означают «не заводить».
      # Существующего пользователя эти переменные не трогают.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Администратор}

    # Сервис отдаёт и страницы, и API одним процессом на одном порту.
    ports:
      - "3000:3000"

# Именованный том. Живёт на диске сервера отдельно от контейнеров и
# переживает их пересоздание.
volumes:
  varvara-data:
